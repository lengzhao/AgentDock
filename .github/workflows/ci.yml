name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # The launchd backend only runs on macOS; its unit tests use a fake
      # launchctl, but a real bootstrap is deliberately not exercised in CI
      # because installing a LaunchAgent on a shared runner is a side effect.
